<!DOCTYPE html><html><body>
<input id="t" placeholder="URL"><button onclick="g()">Generate</button><div id="q"></div><a id="d" download="qr.png">Save PNG</a>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>function g(){let q=document.getElementById('q');q.innerHTML='';new QRCode(q,document.getElementById('t').value);setTimeout(()=>{document.getElementById('d').href=q.querySelector('canvas').toDataURL();},200)}</script>
</body></html>
